spring.application.name=auth-service
server.port=8081

spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:auth_service}
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.jooq.sql-dialect=POSTGRES

management.endpoints.web.exposure.include=health,info
auth.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8080}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:smart-recruitment-api}
auth.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:PT15M}
auth.jwt.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:P30D}
auth.jwt.signing-key.private-key-path=${AUTH_JWT_PRIVATE_KEY_PATH}
auth.jwt.signing-key.public-key-path=${AUTH_JWT_PUBLIC_KEY_PATH}
auth.session.idle-ttl=${AUTH_SESSION_IDLE_TTL:P7D}
auth.session.absolute-ttl=${AUTH_SESSION_ABSOLUTE_TTL:P30D}

spring.mail.host=${AUTH_SMTP_HOST:localhost}
spring.mail.port=${AUTH_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=${AUTH_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${AUTH_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.email.from=${AUTH_EMAIL_FROM:no-reply@smart-recruitment.local}
auth.email.verification-base-url=${AUTH_EMAIL_VERIFICATION_BASE_URL:http://localhost:5173/verify-email}
auth.email.password-reset-base-url=${AUTH_EMAIL_PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}

