spring.application.name=core-service
server.port=8082

spring.datasource.url=${CORE_DB_URL:jdbc:postgresql://localhost:5432/core_db}
spring.datasource.username=${CORE_DB_USERNAME:core_service}
spring.datasource.password=${CORE_DB_PASSWORD}
spring.jooq.sql-dialect=POSTGRES

spring.mail.host=${CORE_SMTP_HOST:localhost}
spring.mail.port=${CORE_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
core.email.from=${CORE_EMAIL_FROM:no-reply@smart-recruitment.local}
core.email.company-invitation-base-url=${CORE_EMAIL_COMPANY_INVITATION_BASE_URL:http://localhost:5173/accept-invitation}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_JWT_ISSUER:http://localhost:8080}

core.storage.endpoint=${CORE_STORAGE_ENDPOINT:http://localhost:9000}
core.storage.access-key=${CORE_STORAGE_ACCESS_KEY}
core.storage.secret-key=${CORE_STORAGE_SECRET_KEY}
core.storage.bucket=${CORE_STORAGE_BUCKET:smart-recruitment-cv}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
core.kafka.cv-uploaded-topic=${CORE_CV_UPLOADED_TOPIC:cv.uploaded.v1}
core.kafka.cv-processing-updated-topic=${CORE_CV_PROCESSING_UPDATED_TOPIC:cv.processing.updated.v1}
core.kafka.cv-confirmed-topic=${CORE_CV_CONFIRMED_TOPIC:cv.confirmed.v1}
core.kafka.job-processing-updated-topic=${CORE_JOB_PROCESSING_UPDATED_TOPIC:job.processing.updated.v1}
core.kafka.job-confirmed-topic=${CORE_JOB_CONFIRMED_TOPIC:job.confirmed.v1}
core.kafka.matching-completed-topic=${CORE_MATCHING_COMPLETED_TOPIC:matching.completed.v1}
core.outbox.poll-delay-ms=${CORE_OUTBOX_POLL_DELAY_MS:1000}
core.outbox.batch-size=${CORE_OUTBOX_BATCH_SIZE:20}

management.endpoints.web.exposure.include=health,info
