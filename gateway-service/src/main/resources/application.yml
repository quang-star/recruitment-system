server:
  port: 8080

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:8081/.well-known/jwks.json}
          issuer-uri: ${AUTH_JWT_ISSUER:http://localhost:8080}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/api/v2/auth/**,/api/v2/users/**,/.well-known/jwks.json
            - id: core-service
              uri: ${CORE_SERVICE_URL:http://core-service:8082}
              predicates:
                - Path=/api/v2/companies/**,/api/v2/recruiter/**,/api/v2/candidates/**,/api/v2/candidate/**,/api/v2/cvs/**,/api/v2/jobs/**,/api/v2/applications/**,/api/v2/notifications/**,/api/v2/dashboard/**,/api/v2/public/**
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://ai-service:8083}
              predicates:
                - Path=/api/v2/parsed-cvs/**,/api/v2/parsed-jds/**,/api/v2/matching-requests/**,/api/v2/matching-results/**,/api/v2/rankings/**,/api/v2/taxonomy/**,/api/v2/ai-tasks/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${WEB_ORIGIN:http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,Idempotency-Key,X-Correlation-Id
                exposed-headers: X-Correlation-Id
                allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
