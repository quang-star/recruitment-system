openapi: 3.1.0
info:
  title: Smart Recruitment Common HTTP Contract
  version: 1.0.0
paths: {}
components:
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page; its presence selects the paged response instead of the legacy array.
      schema: { type: integer, minimum: 0, maximum: 100000 }
    PageSize:
      name: size
      in: query
      description: Defaults to 12 for jobs and 10 for applications; used with page.
      schema: { type: integer, minimum: 1, maximum: 100 }
    SearchText:
      name: q
      in: query
      schema: { type: string, maxLength: 200 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    PageResponse:
      $ref: ../schemas/page-response-v1.schema.json
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, correlationId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    AsyncCommandResponse:
      type: object
      additionalProperties: false
      required: [taskId, resourceId, status, statusUrl, submittedAt]
      properties:
        taskId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        status:
          const: QUEUED
        statusUrl:
          type: string
          format: uri-reference
        submittedAt:
          type: string
          format: date-time
