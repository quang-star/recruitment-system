openapi: 3.1.0
info:
  title: Candidate account avatar API
  version: 2.0.0
paths:
  /api/v2/candidates/me/avatar:
    post:
      summary: Replace the signed-in candidate's avatar
      description: Validates and re-encodes a JPEG or PNG up to 2 MiB and 4096 pixels per side. Requires the current profile version.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: version
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated candidate profile with a new avatarUrl and version.
        '400':
          description: Invalid or unsupported image.
        '409':
          description: Profile version conflict.
  /api/v2/candidates/me/avatar/{id}:
    get:
      summary: Download the signed-in candidate's current avatar
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Normalized avatar image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Avatar is not the current user's current avatar.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
