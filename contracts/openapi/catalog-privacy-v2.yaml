  /api/v2/taxonomy/pending-skills/{skillId}/candidates:
    get:
      security:
      - bearerAuth: []
      summary: Rank canonical skill candidates for explicit admin review
      description: Read-only recommendation. Lexical scores use SequenceMatcher ratio
        with autojunk; optional semantic scores use local cosine similarity. These
        uncalibrated similarity values only rank candidates, do not represent probability
        or accuracy, and never select, merge or rewrite skills. Semantic computation
        requires explicit opt-in and falls back to lexical review if unavailable.
        Exact aliases resolve before fuzzy or semantic ranking.
      parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: semantic
        in: query
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
      responses:
        '200':
          description: Ranking and truthful method/model metadata; scores remain separate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCandidateResult'
        '403':
          description: SYSTEM_ADMIN role required
        '404':
          description: Skill not found
        '422':
          description: Invalid options
  /api/v2/cvs/{cvId}:
    delete:
      security:
      - bearerAuth: []
      summary: Owner deletes a CV and all its versions
      description: Immediately revoke related recruiter access and scores, retain
        minimal application history, and durably queue original PDF and AI analysis
        erasure. Late processing cannot restore erased data. Repeated deletion is
        idempotent. No automatic 90-day expiry.
      parameters:
      - name: cvId
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: version
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '202':
          description: ERASURE_REQUESTED; asynchronous cleanup retries storage failures
        '404':
          description: CV not owned by caller
        '409':
          description: Stale CV version
  /api/v2/candidate/applications/{applicationId}/cv-access:
    delete:
      security:
      - bearerAuth: []
      summary: Revoke only this application's CV access and matching data
      description: Application status and access granted through other applications
        remain unchanged. Withdrawal also revokes its own grant.
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: version
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '204':
          description: Access revoked or previously revoked
        '404':
          description: Application not owned by caller
        '409':
          description: Stale application version
