openapi: 3.1.0
info:
  title: Catalog, classification and CV privacy
  version: 2.0.0
paths:
  /api/v2/public/job-categories:
    get:
      summary: Approved industry, specialization and position catalog
      responses:
        '200':
          description: Active entries with merged parent aliases resolved
  /api/v2/dashboard/catalog:
    get:
      security:
      - bearerAuth: []
      summary: Admin catalog including proposals and retired entries
      responses:
        '200':
          description: Entries with IDs, kind, parentId, name, status and version
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryEntry'
        '403':
          description: SYSTEM_ADMIN role required
    post:
      security:
      - bearerAuth: []
      summary: Admin creates an active entry under an approved parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - name
              - reason
              properties:
                kind:
                  enum:
                  - INDUSTRY
                  - SPECIALIZATION
                  - POSITION
                parentId:
                  type:
                  - string
                  - 'null'
                  pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
                  maxLength: 19
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                reason:
                  $ref: '#/components/schemas/ChangeReason'
      responses:
        '200':
          description: Created active entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEntry'
        '403':
          description: SYSTEM_ADMIN role required
        '409':
          description: Duplicate name
  /api/v2/dashboard/catalog/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
        maxLength: 19
    put:
      security:
      - bearerAuth: []
      summary: Review a catalog entry without rewriting historical JD snapshots
      description: DEFER moves PENDING to DEFERRED; REOPEN moves DEFERRED to PENDING.
        EDIT and MERGE accept ACTIVE or PENDING; APPROVE and REJECT accept PENDING.
        APPROVE may include an edited name atomically. Kind and parent are immutable
        after creation. Every mutation requires a nonblank reason and the shown entry
        version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              - action
              - reason
              properties:
                version:
                  type: integer
                  minimum: 0
                action:
                  enum:
                  - APPROVE
                  - EDIT
                  - MERGE
                  - REJECT
                  - DEFER
                  - REOPEN
                reason:
                  $ref: '#/components/schemas/ChangeReason'
                name:
                  type:
                  - string
                  - 'null'
                  maxLength: 160
                mergeTargetId:
                  type:
                  - string
                  - 'null'
                  pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
                  maxLength: 19
      responses:
        '200':
          description: Updated entry; audit history persisted in the same transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEntry'
        '403':
          description: SYSTEM_ADMIN role required
        '409':
          description: Stale version or already reviewed entry
  /api/v2/dashboard/catalog/history:
    get:
      security:
      - bearerAuth: []
      summary: Search Core career catalog history independently of the AI skill history
      description: All filters are optional and combined. From and to are inclusive
        ISO timestamps with an explicit offset. Rows sort by occurredAt descending,
        then id descending. Legacy reason, correlation and version remain null.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: actorUserId
        in: query
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: resourceId
        in: query
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: action
        in: query
        schema:
          enum:
          - CREATE
          - PROPOSE
          - EDIT
          - APPROVE
          - REJECT
          - MERGE
          - DEFER
          - REOPEN
      - name: correlationId
        in: query
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Filtered Core audit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAuditPage'
        '400':
          description: Invalid filter
          timestamp range or pagination: null
        '403':
          description: SYSTEM_ADMIN role required
  /api/v2/dashboard/catalog/{id}/history:
    get:
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      responses:
        '200':
          description: Actor, action, timestamp, version, reason, correlation and
            before/after states; new audit fields remain null for legacy rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryHistoryEntry'
        '403':
          description: SYSTEM_ADMIN role required
  /api/v2/taxonomy/skills:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Catalog CAS version, published taxonomyVersion and skills with
            aliases, classification, relations and proposal statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCatalog'
        '403':
          description: SYSTEM_ADMIN role required
    post:
      security:
      - bearerAuth: []
      summary: Create, edit, approve, merge, reject, defer or reopen a skill
      description: Required catalog version prevents lost updates. Accepted changes
        to the published ACTIVE definitions publish an immutable taxonomy version;
        pending EDIT, REJECT, DEFER and REOPEN only advance the review catalog version.
        APPROVE can include the edited name, aliases, type, category and relations
        atomically. Relation targets must be other ACTIVE skills; duplicates and hierarchical
        cycles are rejected. DEFER only accepts PENDING and REOPEN only accepts DEFERRED;
        EDIT and MERGE require ACTIVE or PENDING. JD parsing proposes unknown skills
        automatically; confirmed job-scoped skills remain usable before approval.
        Every mutation records a nonblank reason and request correlation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              - action
              - reason
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 0
                action:
                  enum:
                  - CREATE
                  - APPROVE
                  - EDIT
                  - MERGE
                  - REJECT
                  - DEFER
                  - REOPEN
                reason:
                  $ref: '#/components/schemas/ChangeReason'
                skillId:
                  type:
                  - string
                  - 'null'
                  pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
                  maxLength: 19
                name:
                  type:
                  - string
                  - 'null'
                  maxLength: 240
                aliases:
                  type:
                  - array
                  - 'null'
                  maxItems: 50
                  items:
                    type: string
                type:
                  anyOf:
                  - $ref: '#/components/schemas/SkillType'
                  - type: 'null'
                category:
                  anyOf:
                  - $ref: '#/components/schemas/SkillCategory'
                  - type: 'null'
                relations:
                  type:
                  - array
                  - 'null'
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/SkillRelation'
                mergeTargetId:
                  type:
                  - string
                  - 'null'
                  pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
                  maxLength: 19
      responses:
        '200':
          description: Updated skill, catalog version and published taxonomy version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillActionResult'
        '403':
          description: SYSTEM_ADMIN role required
        '409':
          description: Stale catalog version or conflicting alias
        '422':
          description: Invalid action; published names and aliases must not exceed
            160 characters
  /api/v2/taxonomy/skills/history:
    get:
      security:
      - bearerAuth: []
      summary: Search AI skill history independently of the Core career catalog history
      description: All filters are optional and combined. From and to are inclusive
        ISO timestamps with an explicit offset. Rows sort newest first. Contact information
        is masked in the returned review state and reason without changing stored
        history; redacted records indicate this projection.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: actorId
        in: query
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: resourceId
        in: query
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: action
        in: query
        schema:
          enum:
          - CREATE
          - PROPOSE
          - EDIT
          - APPROVE
          - REJECT
          - MERGE
          - DEFER
          - REOPEN
      - name: correlationId
        in: query
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Filtered, bounded AI audit projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillAuditPage'
        '403':
          description: SYSTEM_ADMIN role required
        '422':
          description: Invalid filter
          timestamp range or pagination: null
  /api/v2/taxonomy/skills/{skillId}/history:
    get:
      security:
      - bearerAuth: []
      parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      responses:
        '200':
          description: Last 100 changes, newest first; reason and correlation remain
            null for legacy rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillHistoryEntry'
        '403':
          description: SYSTEM_ADMIN role required
  /api/v2/taxonomy/pending-skills:
    get:
      security:
      - bearerAuth: []
      summary: Filter and page skill proposals with eligible source counts
      description: Counts include current eligible source occurrences. Legacy proposals
        without an occurrence ledger truthfully return zero counts and null dates.
        Review mutations still use the global catalogVersion through the existing
        skill action API.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          enum:
          - PENDING
          - DEFERRED
          - REJECTED
          - ACTIVE
          - MERGED
          default: PENDING
      - name: sourceKind
        in: query
        schema:
          enum:
          - CV
          - JD
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/SkillType'
      - name: category
        in: query
        schema:
          $ref: '#/components/schemas/SkillCategory'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 120
      - name: sort
        in: query
        schema:
          enum:
          - OCCURRENCES_DESC
          - LAST_SEEN_DESC
          - FIRST_SEEN_ASC
          default: OCCURRENCES_DESC
      responses:
        '200':
          description: Paged review queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSkillPage'
        '403':
          description: SYSTEM_ADMIN role required
        '422':
          description: Invalid filter or pagination
  /api/v2/taxonomy/pending-skills/{skillId}:
    get:
      security:
      - bearerAuth: []
      summary: Skill review definition with eligible occurrence summary
      parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          maxLength: 19
      responses:
        '200':
          description: Current skill definition and source counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSkillDetail'
        '403':
          description: SYSTEM_ADMIN role required
        '404':
          description: Skill not found
  /api/v2/taxonomy/pending-skills/{skillId}/occurrences:
    get:
      security:
      - bearerAuth: []
      summary: Page current skill occurrences using bounded structural metadata
      description: Returns opaque source/revision references and verified evidence
        coordinates. Context describes extraction fields and known skill IDs; it is
        structured metadata. No document text, owner identity, source title, hash,
        object URL or download route is exposed. Deleted or ineligible sources are
        excluded.
      parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
