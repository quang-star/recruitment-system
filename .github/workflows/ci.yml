name: verification

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.lock
      - name: Install AI dependencies from lock constraints
        working-directory: ai-service
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Validate architecture
        shell: pwsh
        run: ./scripts/validate-architecture.ps1
      - name: Validate contracts
        run: python -m pytest -q -p no:cacheprovider contracts/tests
      - name: Test AI service
        working-directory: ai-service
        run: python -m pytest -q -p no:cacheprovider

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Java reactor
        run: bash ./auth-service/mvnw -f pom.xml test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_PASSWORD: ci-postgres-admin
      AUTH_DB_PASSWORD: ci-auth-db
      CORE_DB_PASSWORD: ci-core-db
      AI_DB_PASSWORD: ci-ai-db
      MINIO_ROOT_USER: ci-minio-user
      MINIO_ROOT_PASSWORD: ci-minio-password-change-me
    steps:
      - uses: actions/checkout@v7
      - name: Validate production-like and development Compose models
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
