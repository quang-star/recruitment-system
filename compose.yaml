services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.2.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic cv.uploaded.v1 --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic cv.processing.updated.v1 --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic cv.confirmed.v1 --partitions 3 --replication-factor 1

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_MAX_MESSAGES: 1000
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: auth_service
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8080}
      AUTH_JWT_AUDIENCE: smart-recruitment-api
      AUTH_JWT_PRIVATE_KEY_PATH: /run/secrets/auth-jwt-private.pem
      AUTH_JWT_PUBLIC_KEY_PATH: /run/secrets/auth-jwt-public.pem
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: 1025
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-no-reply@smart-recruitment.local}
      AUTH_EMAIL_VERIFICATION_BASE_URL: ${AUTH_EMAIL_VERIFICATION_BASE_URL:-http://localhost:5173/verify-email}
    volumes:
      - type: bind
        source: ${AUTH_JWT_PRIVATE_KEY_FILE:-./.local/secrets/auth-jwt-private.pem}
        target: /run/secrets/auth-jwt-private.pem
        read_only: true
      - type: bind
        source: ${AUTH_JWT_PUBLIC_KEY_FILE:-./.local/secrets/auth-jwt-public.pem}
        target: /run/secrets/auth-jwt-public.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    environment:
      CORE_DB_URL: jdbc:postgresql://postgres:5432/core_db
      CORE_DB_USERNAME: core_service
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8080}
      AUTH_JWT_AUDIENCE: smart-recruitment-api
      CORE_STORAGE_ENDPOINT: http://minio:9000
      CORE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      CORE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CORE_STORAGE_BUCKET: ${CORE_STORAGE_BUCKET:-smart-recruitment-cv}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORE_CV_CONFIRMED_TOPIC: cv.confirmed.v1
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      AI_DB_URL: postgresql+psycopg://ai_service:${AI_DB_PASSWORD}@postgres:5432/ai_db
      AI_AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AI_AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8080}
      AI_AUTH_JWT_AUDIENCE: smart-recruitment-api
      AI_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_KAFKA_CONSUMER_GROUP: ai-cv-worker-v1
      AI_KAFKA_CV_UPLOADED_TOPIC: cv.uploaded.v1
      AI_KAFKA_CV_PROCESSING_UPDATED_TOPIC: cv.processing.updated.v1
      AI_KAFKA_CV_CONFIRMED_TOPIC: cv.confirmed.v1
      AI_STORAGE_ENDPOINT: http://minio:9000
      AI_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      AI_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AI_STORAGE_BUCKET: ${CORE_STORAGE_BUCKET:-smart-recruitment-cv}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      CORE_SERVICE_URL: http://core-service:8082
      AI_SERVICE_URL: http://ai-service:8083
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8080}
      AUTH_JWT_AUDIENCE: smart-recruitment-api
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - core-service
      - ai-service

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - gateway-service

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-smart-recruitment-postgres-v2}
  kafka_data:
  minio_data:
